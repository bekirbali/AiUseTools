<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Top Face: Vibrant Sky to Electric Cyan -->
    <linearGradient id="favTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Left Face: Tech Indigo to Violet -->
    <linearGradient id="favLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Right Face: Deep Ocean to Vivid Blue/Cyan -->
    <linearGradient id="favRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <!-- Solid Isometric AI Prism Faces (Edge-to-Edge Scale, Maximum Favicon Presence) -->
  <path
    d="M16 1.2 L30.5 9.2 L16 16.5 L1.5 9.2 Z"
    fill="url(#favTop)"
    stroke="url(#favTop)"
    stroke-width="0.8"
    stroke-linejoin="round"
  />
  <path
    d="M1 10.8 L14.8 18 L14.8 30.8 L1 23.6 Z"
    fill="url(#favLeft)"
    stroke="url(#favLeft)"
    stroke-width="0.8"
    stroke-linejoin="round"
  />
  <path
    d="M17.2 18 L31 10.8 L31 23.6 L17.2 30.8 Z"
    fill="url(#favRight)"
    stroke="url(#favRight)"
    stroke-width="0.8"
    stroke-linejoin="round"
  />
</svg>
