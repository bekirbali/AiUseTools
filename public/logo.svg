<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Top Face: Vibrant Sky to Electric Cyan -->
    <linearGradient id="logoTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Left Face: Tech Indigo to Violet -->
    <linearGradient id="logoLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Right Face: Deep Ocean to Vivid Blue/Cyan -->
    <linearGradient id="logoRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <!-- Solid Isometric AI Prism Faces (Zero Clutter, Maximum Legibility) -->
  <path
    d="M16 3.5 L26.5 9.5 L16 15.5 L5.5 9.5 Z"
    fill="url(#logoTop)"
    stroke="url(#logoTop)"
    stroke-width="0.8"
    stroke-linejoin="round"
  />
  <path
    d="M5 11 L15 16.8 L15 28.5 L5 22.8 Z"
    fill="url(#logoLeft)"
    stroke="url(#logoLeft)"
    stroke-width="0.8"
    stroke-linejoin="round"
  />
  <path
    d="M17 16.8 L27 11 L27 22.8 L17 28.5 Z"
    fill="url(#logoRight)"
    stroke="url(#logoRight)"
    stroke-width="0.8"
    stroke-linejoin="round"
  />
</svg>
